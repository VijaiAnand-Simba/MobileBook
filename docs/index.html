<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGM Device Check</title>
    <style>
        :root {
            --bg: #fef3c7;
            --glass: rgba(255,255,255,0.95);
            --primary: #059669;
            --primary-glow: rgba(5,150,105,0.3);
            --accent: #dc2626;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: rgba(0,0,0,0.1);
            --shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            --radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #fef7e0 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 1rem;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 2rem 0;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), #047857);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin: 0 auto 0.25rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Search */
        .search-container {
            position: relative;
            margin: 2rem 0;
        }

        .search-input {
            width: 100%;
            padding: 1rem 3.5rem 1rem 3rem;
            border: 2px solid transparent;
            border-radius: var(--radius);
            font-size: 1rem;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 20px 40px -10px var(--primary-glow), 0 0 0 3px rgba(5,150,105,0.1);
            transform: translateY(-2px);
        }

        .search-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .search-input:focus + .search-icon {
            color: var(--primary);
        }

        .clear-btn {
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            background: var(--text-muted);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-input:focus ~ .clear-btn,
        .has-text ~ .clear-btn {
            opacity: 1;
        }

        .clear-btn:hover {
            background: var(--accent);
            transform: translateY(-50%) scale(1.1);
        }

        /* Filters - Compact */
        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin: 1.5rem 0;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .filter-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-chips {
            display: flex;
            gap: 0.5rem;
        }

        .filter-chip {
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.5);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .filter-chip:hover {
            background: white;
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .filter-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 5px 15px -5px var(--primary-glow);
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: rgba(255,255,255,0.5);
            border-radius: var(--radius);
            padding: 0.25rem;
            margin: 1.5rem 0;
            backdrop-filter: blur(10px);
            gap: 0.25rem;
        }

        .tab-btn {
            flex: 1;
            padding: 1rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: calc(var(--radius) - 0.25rem);
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.95rem;
            position: relative;
            overflow: hidden;
        }

        .tab-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: var(--shadow);
        }

        .tab-badge {
            position: absolute;
            top: 0.5rem;
            right: 0.75rem;
            background: var(--accent);
            color: white;
            padding: 0.125rem 0.5rem;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        /* Content */
        .content {
            min-height: 400px;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results-header {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .results-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .results-meta {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Compact Device Cards */
        .devices-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }

        .device-card {
            background: rgba(255,255,255,0.8);
            border-radius: var(--radius);
            padding: 1.25rem;
            border: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .device-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: var(--primary);
        }

        .device-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary), #047857);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .device-card:hover::before {
            opacity: 1;
        }

        .device-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .device-brand {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--primary);
        }

        .device-model {
            font-weight: 700;
            font-size: 1.1rem;
            flex: 1;
        }

        .os-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .os-android {
            background: rgba(76,175,80,0.2);
            color: #15803d;
        }

        .os-ios {
            background: rgba(3,23,41,0.2);
            color: #064e3b;
        }

        .device-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .rq-badge {
            background: rgba(245,101,101,0.2);
            color: #dc2626;
            padding: 0.125rem 0.5rem;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        /* New Devices */
        .new-devices-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        }

        .new-device-card {
            border: 2px solid var(--accent);
            position: relative;
        }

        .new-device-card::before {
            content: 'NEW';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: white;
            padding: 0.25rem 1rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* States */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0,0,0,0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .no-results i {
            font-size: 3rem;
            opacity: 0.3;
            display: block;
            margin-bottom: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 0.5rem;
            }
            
            .glass-card {
                padding: 1.5rem;
            }
            
            .filters {
                flex-direction: column;
                align-items: center;
            }
            
            .filter-chips {
                justify-content: center;
            }
            
            .devices-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="glass-card" style="max-width: 800px; margin: 0 auto;">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <i class="fas fa-heartbeat"></i>
                CGM Check
            </div>
            <div class="subtitle">Device compatibility checker</div>
        </div>

        <!-- Search -->
        <div class="search-container">
            <input 
                type="text" 
                id="deviceSearch" 
                class="search-input"
                placeholder="iPhone 14, Galaxy S23, Pixel 8..."
                autocomplete="off"
            >
            <i class="fas fa-magnifying-glass search-icon"></i>
            <button id="clearSearch" class="clear-btn">
                <i class="fas fa-xmark"></i>
            </button>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <div class="filter-label">OS</div>
                <div class="filter-chips">
                    <div class="filter-chip active" data-filter="all">All</div>
                    <div class="filter-chip" data-filter="android">Android</div>
                    <div class="filter-chip" data-filter="ios">iOS</div>
                </div>
            </div>
            <div class="filter-group">
                <div class="filter-label">Product</div>
                <div class="filter-chips">
                    <div class="filter-chip active" data-product="all">All</div>
                    <div class="filter-chip" data-product="E3">E3</div>
                    <div class="filter-chip" data-product="365">365</div>
                    <div class="filter-chip" data-product="NOW">NOW</div>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="compatible">
                Compatible <span class="tab-badge" id="compatibleCount">-</span>
            </button>
            <button class="tab-btn" data-tab="new">
                New Devices <span class="tab-badge" id="newCount">-</span>
            </button>
        </div>

        <!-- Content -->
        <div class="content">
            <div id="compatibleTab" class="tab-panel active">
                <div class="results-header">
                    <div class="results-title">Compatible Devices</div>
                    <div class="results-meta" id="lastUpdated">-</div>
                </div>
                <div id="searchResults" class="devices-grid"></div>
                <div id="noResults" class="no-results" style="display: none;">
                    <i class="fas fa-search"></i>
                    <h3>No matches</h3>
                    <p>Try a different search or clear filters</p>
                </div>
            </div>

            <div id="newTab" class="tab-panel">
                <div class="results-header">
                    <div class="results-title">New Market Devices</div>
                </div>
                <div id="newResults" class="new-devices-grid"></div>
                <div id="noNewDevices" class="no-results" style="display: none;">
                    <i class="fas fa-check"></i>
                    <h3>All up to date!</h3>
                </div>
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
    </div>

    <script src="js/search.js"></script>
    <script>
        // Your existing JavaScript goes here - same app.js and search.js
        // Just add these event listeners:
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('deviceSearch');
            const clearBtn = document.getElementById('clearSearch');
            
            // Toggle clear button
            searchInput.addEventListener('input', function() {
                clearBtn.parentElement.classList.toggle('has-text', this.value.length > 0);
            });
            
            clearBtn.addEventListener('click', function() {
                searchInput.value = '';
                searchInput.focus();
                clearBtn.parentElement.classList.remove('has-text');
                // Trigger search update
                window.searchEngine?.search('');
            });
        });
    </script>
</body>
</html>
