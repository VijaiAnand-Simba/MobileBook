name: Update Compatibility List

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    paths:
      - 'pdf/*.pdf'
      - 'docx/*.docx'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install python-docx pdfplumber PyMuPDF
          echo "✅ Dependencies installed"
          
      - name: Check file types
        run: |
          echo "📁 Checking available files..."
          echo "PDF files:"
          ls -lh pdf/ 2>/dev/null || echo "   (no pdf folder)"
          echo ""
          echo "DOCX files:"
          ls -lh docx/ 2>/dev/null || echo "   (no docx folder)"
          
      - name: Parse Documents (DOCX)
        run: |
          echo "📄 Parsing Compatibility Documents..."
          python scripts/parse_documents.py
          
      - name: Copy JSON to docs
        run: |
          mkdir -p docs
          cp data/compatibility.json docs/
          echo "✅ Copied compatibility.json to docs/"
          
      - name: Verify JSON structure
        run: |
          echo "🔍 Verifying JSON structure..."
          python3 << 'EOF'
          import json
          import sys
          
          try:
              with open('docs/compatibility.json', 'r') as f:
                  data = json.load(f)
              
              if 'products' not in data:
                  print("❌ Error: 'products' key not found in JSON")
                  sys.exit(1)
              
              total = 0
              us_count = 0
              ous_count = 0
              
              print("\n📊 Device Count by Product:")
              for product in ['E3', '365', 'NOW']:
                  if product in data['products']:
                      ios = len(data['products'][product].get('ios', []))
                      android = len(data['products'][product].get('android', []))
                      product_total = ios + android
                      total += product_total
                      
                      for os_type in ['ios', 'android']:
                          for device in data['products'][product].get(os_type, []):
                              if device.get('region') == 'US':
                                  us_count += 1
                              elif device.get('region') == 'OUS':
                                  ous_count += 1
                      
                      print(f"  {product}: {ios} iOS + {android} Android = {product_total}")
              
              print(f"\n✅ Valid JSON")
              print(f"🌍 US Devices: {us_count}")
              print(f"🌎 OUS Devices: {ous_count}")
              print(f"📊 Total devices: {total}")
              
              if total == 0:
                  print("⚠️  Warning: No devices found!")
                  sys.exit(1)
                  
          except Exception as e:
              print(f"❌ Error: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
          EOF
          
      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/compatibility.json docs/compatibility.json
          git diff --staged --quiet || (git commit -m "🤖 Update compatibility data ($(date +'%Y-%m-%d'))" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
