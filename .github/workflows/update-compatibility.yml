name: Update Compatibility List

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    paths:
      - 'pdf/*.pdf'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          
      - name: Parse PDFs (US + OUS)
        run: |
          echo "📄 Parsing US and OUS PDFs..."
          python scripts/parse_pdf.py
          
      - name: Copy JSON to docs
        run: |
          cp data/compatibility.json docs/
          echo "✅ Copied to docs folder"
          
      - name: Verify JSON structure
        run: |
          echo "🔍 Verifying JSON structure..."
          python3 << 'EOF'
          import json
          import sys
          
          try:
              with open('docs/compatibility.json', 'r') as f:
                  data = json.load(f)
              
              if 'products' not in data:
                  print("❌ Error: 'products' key not found in JSON")
                  sys.exit(1)
              
              total = 0
              us_count = 0
              ous_count = 0
              
              for product in ['E3', '365', 'NOW']:
                  if product in data['products']:
                      for os_type in ['ios', 'android']:
                          devices = data['products'][product].get(os_type, [])
                          total += len(devices)
                          us_count += sum(1 for d in devices if d.get('region') == 'US')
                          ous_count += sum(1 for d in devices if d.get('region') == 'OUS')
              
              print(f"\n✅ Valid JSON")
              print(f"🌍 US Devices: {us_count}")
              print(f"🌎 OUS Devices: {ous_count}")
              print(f"📊 Total devices: {total}")
              
              if total == 0:
                  print("⚠️  Warning: No devices found!")
                  sys.exit(1)
                  
          except Exception as e:
              print(f"❌ Error: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
          EOF
          
      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/compatibility.json docs/compatibility.json
          git diff --staged --quiet || (git commit -m "🤖 Update compatibility data (US + OUS)" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
