name: Update Compatibility List
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    paths:
      - 'pdf/*.pdf'
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          
      - name: Parse PDF (all 6 tables)
        run: |
          echo "📄 Parsing all 6 tables from PDF..."
          python scripts/parse_pdf.py pdf/compatibility.pdf
          
      - name: Apply Android RQ patch (safety net)
        run: |
          echo "🩹 Applying android_rq_patch.json to guarantee correct RQ values..."
          python scripts/apply_rq_patch.py \
            data/compatibility.json \
            scripts/android_rq_patch.json

      - name: Copy JSON to docs
        run: |
          cp data/compatibility.json docs/
          echo "✅ Copied to docs folder"
          
      - name: Verify JSON structure
        run: |
          echo "🔍 Verifying JSON structure..."
          python3 << 'EOF'
          import json
          import sys
          
          try:
              with open('docs/compatibility.json', 'r') as f:
                  data = json.load(f)
              
              # New structure: products -> product_name -> os_type
              if 'products' not in data:
                  print("❌ Error: 'products' key not found in JSON")
                  sys.exit(1)
              
              total = 0
              rq_total = 0
              for product in ['E3', '365', 'NOW']:
                  if product in data['products']:
                      ios_list    = data['products'][product].get('ios', [])
                      android_list = data['products'][product].get('android', [])
                      ios_rq      = sum(1 for d in ios_list     if d.get('rationally_qualified'))
                      android_rq  = sum(1 for d in android_list if d.get('rationally_qualified'))
                      total      += len(ios_list) + len(android_list)
                      rq_total   += ios_rq + android_rq
                      print(f"   {product}: iOS={len(ios_list)} (RQ={ios_rq}), Android={len(android_list)} (RQ={android_rq})")
                      
                      # Fail if android RQ is suspiciously zero
                      if len(android_list) > 0 and android_rq == 0:
                          print(f"❌ Error: {product} Android has {len(android_list)} devices but RQ=0 — parser bug!")
                          sys.exit(1)
              
              print(f"\n✅ Valid JSON")
              print(f"📊 Total devices: {total}  (RQ: {rq_total})")
              
              if total == 0:
                  print("⚠️  Warning: No devices found!")
                  sys.exit(1)
                  
          except Exception as e:
              print(f"❌ Error: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
          EOF
          
      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/compatibility.json docs/compatibility.json
          git diff --staged --quiet || (git commit -m "🤖 Update compatibility data (all 6 tables)" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
