name: Update Compatibility List

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:      # Manual trigger
  push:
    paths:
      - 'pdf/*.pdf'       # Trigger when PDF is updated

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          
      - name: Parse PDF and generate JSON
        run: |
          python scripts/parse_pdf.py pdf/compatibility.pdf
          
      - name: Verify JSON output
        run: |
          echo "✅ Checking generated JSON files..."
          if [ -f data/compatibility.json ]; then
            echo "✅ compatibility.json created"
            cat data/compatibility.json | head -20
          else
            echo "❌ compatibility.json not found"
            exit 1
          fi
          
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/compatibility.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Update compatibility data [automated]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
