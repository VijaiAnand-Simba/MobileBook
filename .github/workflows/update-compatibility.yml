name: Update Compatibility List

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    paths:
      - 'pdf/*.pdf'

permissions:
   contents: write       

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          
      - name: Parse PDF and generate JSON
        run: |
          echo "📄 Parsing PDF..."
          python scripts/parse_pdf.py pdf/compatibility.pdf
          
      - name: Copy JSON directly to docs folder
        run: |
          echo "📋 Copying compatibility.json to docs/..."
          cp data/compatibility.json docs/
          
          echo "📋 Copying new_devices.json to docs/..."
          if [ -f data/new_devices.json ]; then
            cp data/new_devices.json docs/
          else
            echo '{"last_updated":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","devices":[]}' > docs/new_devices.json
          fi
          
          echo "✅ Files copied successfully!"
          echo ""
          echo "📊 Files in docs/:"
          ls -lh docs/*.json
          echo ""
          echo "📱 Device count:"
          grep -c '"name"' docs/compatibility.json || echo "0"
          
      - name: Verify JSON is valid
        run: |
          echo "🔍 Verifying JSON structure..."
          python3 << 'EOF'
          import json
          import sys
          
          try:
              with open('docs/compatibility.json', 'r') as f:
                  data = json.load(f)
              
              total = sum(
                  len(devices) 
                  for os_data in [data['android'], data['ios']]
                  for devices in os_data.values()
              )
              
              print(f"✅ Valid JSON")
              print(f"📊 Total devices: {total}")
              print(f"   📱 iOS E3: {len(data['ios']['E3'])}")
              print(f"   📱 iOS 365: {len(data['ios']['365'])}")
              print(f"   🤖 Android E3: {len(data['android']['E3'])}")
              print(f"   🤖 Android 365: {len(data['android']['365'])}")
              
              if total == 0:
                  print("⚠️  Warning: No devices found!")
                  sys.exit(1)
                  
          except Exception as e:
              print(f"❌ Error: {e}")
              sys.exit(1)
          EOF
          
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          
          git add data/ docs/compatibility.json docs/new_devices.json
          
          if git diff --staged --quiet; then
            echo "📝 No changes to commit"
          else
            git commit -m "🤖 Auto-update: Compatibility data updated"
            git push origin main
            echo "✅ Changes pushed successfully!"
          fi
